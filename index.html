<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>دخل و خرج Nana 💕</title>
<link rel="manifest" id="manifestLink" href="manifest.webmanifest">
<link rel="icon" id="favLink" href="icon-192.png">
<link rel="apple-touch-icon" id="appleLink" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (2027 palette) ===== */
:root{
  --bg:#F8FAFC;--card:#FFFFFF;--ink:#0F172A;--muted:#475569;--line:#E2E8F0;--sunk:#F1F5F9;
  --pri:#0D9488;--pri-strong:#0F766E;--on-pri:#FFFFFF;--pri-soft:#E6F7F5;
  --sec:#6366F1;--sec-strong:#4F46E5;--sec-soft:#EEF2FF;--on-sec:#FFFFFF;
  --ok:#047857;--ok-soft:#D1FAE5;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#B91C1C;--bad-soft:#FEE2E2;
  --hero1:#0F766E;--hero2:#4F46E5;--hero-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05);
  --font:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root[lang=en]{--font:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
:root[data-theme=dark]{
  --bg:#0B1120;--card:#1E293B;--ink:#F1F5F9;--muted:#A3B1C6;--line:#334155;--sunk:#111A2E;
  --pri:#14B8A6;--pri-strong:#2DD4BF;--on-pri:#042F2E;--pri-soft:#0F3B3A;
  --sec:#818CF8;--sec-strong:#A5B4FC;--sec-soft:#1E1B4B;--on-sec:#1E1B4B;
  --ok:#34D399;--ok-soft:#0E3B2E;--warn:#FBBF24;--warn-soft:#3B2F0B;--bad:#F87171;--bad-soft:#3F1D1D;
  --hero1:#115E59;--hero2:#312E81;--hero-ink:#F1F5F9;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B1120;--card:#1E293B;--ink:#F1F5F9;--muted:#A3B1C6;--line:#334155;--sunk:#111A2E;
  --pri:#14B8A6;--pri-strong:#2DD4BF;--on-pri:#042F2E;--pri-soft:#0F3B3A;
  --sec:#818CF8;--sec-strong:#A5B4FC;--sec-soft:#1E1B4B;--on-sec:#1E1B4B;
  --ok:#34D399;--ok-soft:#0E3B2E;--warn:#FBBF24;--warn-soft:#3B2F0B;--bad:#F87171;--bad-soft:#3F1D1D;
  --hero1:#115E59;--hero2:#312E81;--hero-ink:#F1F5F9;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;padding-top:env(safe-area-inset-top);transition:background .2s,color .2s}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sec);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== layout ===== */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .brand,.nav .wide{display:none}
.nav button{flex:1;border:0;background:none;padding:7px 1px 5px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:10.5px;color:var(--muted);cursor:pointer;min-width:0}
.nav button .i{font-size:19px;line-height:1.3}
.nav button.on{color:var(--pri-strong);font-weight:700}
.main{max-width:860px;margin:0 auto;padding:0 14px calc(100px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;flex-wrap:wrap}
.top .ttl{font-size:19px;font-weight:800;line-height:1.3}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (min-width:920px){
  .shell{display:grid;grid-template-columns:236px 1fr}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;border-top:0;border-inline-end:1px solid var(--line);padding:18px 12px;gap:2px}
  .nav .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;padding:4px 10px 18px}
  .nav .wide{display:flex}
  .nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:9px 12px;border-radius:10px}
  .nav button.on{background:var(--pri-soft)}
  .main{padding-bottom:48px}
  .gear{display:none}
}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--sec));display:grid;place-items:center;color:#fff;font-size:15px}

/* ===== header tools ===== */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--ok)}.pill.ing .dot{background:var(--sec);animation:pulse 1s infinite}.pill.err .dot{background:var(--bad)}.pill.off .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--pri-strong);color:var(--on-pri)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:34px;height:30px;cursor:pointer}

/* ===== surfaces ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-size:17px;margin:0 0 8px;line-height:1.5}
h3{font-size:15.5px;margin:0 0 8px;line-height:1.5}
p{margin:4px 0}
.muted{color:var(--muted)}.sm{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos,.okc{color:var(--ok)}.neg{color:var(--bad)}.warnc{color:var(--warn)}.secc{color:var(--sec-strong)}
.empty{text-align:center;color:var(--muted);padding:16px 8px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.grid2{display:grid;gap:12px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}

/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:22px;padding:20px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero.neg{--hero1:#9F1239;--hero2:#7C2D12}
.hero .lbl{font-size:13.5px;opacity:.9}
.hero .val{font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1.2;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.hero .val small{font-size:15px;font-weight:500;opacity:.9}
.hero .sub{font-size:13.5px;opacity:.95}
.hero .btn{margin-top:10px;background:var(--hero-ink);color:#0F172A;border:0}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.3}
.ring .t b{font-size:18px;display:block}

/* ledger + bars */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (min-width:640px){.ledger{grid-template-columns:repeat(3,1fr)}}
.ledger .it{padding:10px 0;border-bottom:1px solid var(--line)}
.ledger .lbl{font-size:12.5px;color:var(--muted)}
.ledger .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.ledger .s{font-size:11.5px;color:var(--muted)}
.ledger .bad .v{color:var(--bad)}
.bar{margin-bottom:12px}
.bar-h{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:4px}
.track{height:9px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.track span{display:block;height:100%;background:var(--pri);border-radius:99px}
.track.sec span{background:var(--sec)}
.track.over span{background:var(--bad)}

/* alerts */
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;margin-bottom:8px;font-weight:600;font-size:14px}
.alert.bad{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.alert .btn{flex:none}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.5}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri-strong);color:var(--on-pri);border-color:transparent}
.btn.secb{background:var(--sec-strong);color:var(--on-sec);border-color:transparent}
.btn.wide{width:100%;padding:12px;font-size:16px}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:10px}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.link{border:0;background:none;color:var(--sec-strong);cursor:pointer;font-weight:700;text-decoration:underline;padding:0}
.del{border:0;background:none;cursor:pointer;opacity:.55;padding:4px;font-size:15px}
.del:hover{opacity:1}

/* forms */
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:9px 12px;outline:none;min-height:44px}
input:focus,select:focus{border-color:var(--pri)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--sec)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--pri)}
.fld.big input{font-size:22px;font-weight:800;text-align:center}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
.row input[type=checkbox]{flex:0 0 20px;width:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input,.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chip span{display:inline-block;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;background:var(--sunk)}
.chip input:checked+span{background:var(--pri-strong);color:var(--on-pri);border-color:transparent}
.chip input:focus-visible+span,.seg input:focus-visible+span{outline:2px solid var(--sec)}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg label{flex:1;position:relative}
.seg span{display:block;text-align:center;padding:7px 4px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.seg input:checked+span{background:var(--card);box-shadow:var(--shadow);color:var(--pri-strong)}
.seg input[name=ess][value="0"]:checked+span{color:var(--warn)}
.form:has(input[name=model][value=zero]:checked) .m503{display:none}
.form:has(input[name=model][value="503020"]:checked) .mzero{display:none}
.form:has(select[name=mode] option[value=key]:checked) .only-email{display:none}
.form:has(select[name=mode] option[value=email]:checked) .only-key{display:none}
.form:has(select[name=provider] option[value=rest]:checked) .only-fb,.form:has(select[name=provider] option[value=gist]:checked) .only-fb{display:none}
.form:has(select[name=provider] option[value=firebase]:checked) .only-rest,.form:has(select[name=provider] option[value=gist]:checked) .only-rest{display:none}
.form:has(select[name=provider] option[value=firebase]:checked) .only-gist,.form:has(select[name=provider] option[value=rest]:checked) .only-gist{display:none}
.stage{display:grid;grid-template-columns:1fr 130px 36px;gap:6px;margin-bottom:6px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl{border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px;text-align:start;cursor:pointer}
.tpl b{display:block}.tpl span{font-size:12px;color:var(--muted)}
.tpl:hover{border-color:var(--pri)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:18px;flex:none}
.grow{flex:1;min-width:0}
.grow>div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-weight:600;line-height:1.8}
.tag.e{color:var(--pri-strong)}.tag.n{color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.sec{background:var(--sec-soft);color:var(--sec-strong);border-color:transparent}
.day-h{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;margin-top:12px;font-weight:700;border-bottom:1px dashed var(--line)}
.pernav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}

/* advisor + goals */
.insight{display:flex;gap:12px;padding:13px 14px;border-radius:14px;margin-bottom:10px;border:1px solid var(--line);background:var(--card)}
.insight.bad{background:var(--bad-soft);border-color:transparent}
.insight.warn{background:var(--warn-soft);border-color:transparent}
.insight.ok{background:var(--ok-soft);border-color:transparent}
.insight.info{background:var(--sec-soft);border-color:transparent}
.insight p{margin:2px 0 0;font-size:14px}
.ii{font-size:22px;line-height:1.4}
.sub-card{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:10px 0}
.impact{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
.impact li{padding:2px 0}
.total-save{padding:12px;border-radius:12px;background:var(--ok-soft);margin-top:10px}
.alloc{list-style:none;padding:0;margin:8px 0}
.alloc li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.alloc li span{font-variant-numeric:tabular-nums;white-space:nowrap}
.eta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.eta>div{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.stages{list-style:none;padding:0;margin:8px 0}
.stages li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.stages .track{grid-column:2/4;height:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:start;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.steps{padding-inline-start:18px;margin:8px 0}
.mini{background:var(--pri-soft);border-radius:14px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini b{font-size:18px}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
pre{background:var(--sunk);border-radius:10px;padding:10px;overflow:auto;font-size:12px;direction:ltr;text-align:left}
.keybox{font-family:ui-monospace,Consolas,monospace;direction:ltr;letter-spacing:.5px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.donut-wrap{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:16px;align-items:center}
@media (max-width:520px){.donut-wrap{grid-template-columns:1fr}.donut-wrap svg{max-width:240px;margin:auto}}
.donut .c1{font-size:16px;font-weight:800;fill:var(--ink)}
.donut .c2{font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend.col{flex-direction:column}
.legend.col span{display:flex;justify-content:space-between;gap:10px}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:0}
.dot.ok{background:#047857}.dot.warn{background:#D97706}.dot.bad{background:#DC2626}
.hb{display:flex;height:10px;background:var(--line);border-radius:5px;overflow:hidden;min-width:60px}.hb>span{display:block;height:100%}
table.cb td{border-bottom:0;padding:5px 4px}
.sumfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;border-top:2px solid var(--line);margin-top:8px;padding-top:8px;font-weight:700}
table.rft tfoot td{font-weight:700;border-top:2px solid var(--line)}table.rft tfoot tr.net td{font-size:15px;color:var(--pri-strong)}
#print tfoot td{font-weight:700;border-top:2px solid #94A3B8}
.chip-b{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-weight:600}
.chip-b:hover{border-color:var(--pri)}
.qk{display:inline-flex;align-items:center;gap:0}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin-top:6px;max-height:150px;overflow:auto}
.emo button{border:1px solid transparent;background:var(--sunk);border-radius:10px;font-size:20px;height:38px;cursor:pointer}
.emo button.on{border-color:var(--pri);background:var(--pri-soft)}
.icon-in{font-size:20px;text-align:center;max-width:90px}
/* fab, modal, picker, toast */
.fab{position:fixed;inset-inline-start:auto;inset-inline-end:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--pri-strong),var(--sec-strong));color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 22px rgba(79,70,229,.3);cursor:pointer;z-index:25}
:root[dir=rtl] .fab{inset-inline-end:auto;inset-inline-start:auto;left:18px;right:auto}
:root[dir=ltr] .fab{right:18px;left:auto}
@media (min-width:920px){.fab{bottom:28px}}
.modal,.dp{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.dp{z-index:70;align-items:center}
.modal.open,.dp.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));position:relative}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:22px}}
.x{position:absolute;inset-inline-end:12px;top:12px;border:0;background:var(--sunk);width:34px;height:34px;border-radius:10px;cursor:pointer}
.dp-box{background:var(--card);border-radius:18px;padding:14px;width:min(340px,92vw);box-shadow:var(--shadow)}
.dp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dp-h button{border:0;background:var(--sunk);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
.dp-w,.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dp-w span{font-size:11.5px;color:var(--muted)}
.dp-g button{border:0;background:none;height:38px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.dp-g button:hover{background:var(--sunk)}
.dp-g button.today{outline:1.5px solid var(--sec)}

function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];const gy2=gm>2?gy+1:gy;let days=355666+365*gy+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g[gm-1];let jy=-1595+33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365;}let jm,jd;if(days<186){jm=1+~~(days/31);jd=1+days%31;}else{jm=7+~~((days-186)/30);jd=1+(days-186)%30;}return[jy,jm,jd];}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++;}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365;}let gd=days+1;const sa=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];return[gy,gm,gd];}
function jLeap(y){const g=j2g(y,12,30),b=g2j(g[0],g[1],g[2]);return b[0]===y&&b[1]===12&&b[2]===30;}
function mLen(y,m){return m<=6?31:m<=11?30:(jLeap(y)?30:29);}
const dToJ=d=>g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
const todayJ=()=>dToJ(new Date());
function daysAgoJ(n){const d=new Date();d.setDate(d.getDate()-n);return dToJ(d);}
function daysAheadJ(n){const d=new Date();d.setDate(d.getDate()+Math.round(n));return dToJ(d);}

function parseJ(s){const m=toEn(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(y<1300||y>1600||mo<1||mo>12||d<1||d>mLen(y,mo))return null;return[y,mo,d];}
function jTime(a){const g=j2g(a[0],a[1],a[2]);return Date.UTC(g[0],g[1]-1,g[2]);}

function fmtDur(days){days=Math.max(0,Math.round(days));let m=Math.floor(days/MONTH_D),d=Math.round(days-m*MONTH_D);if(d>=30){m++;d=0;}const p=[];if(m)p.push(tr('dur_m',{a:dg(m)}));if(d||!m)p.push(tr('dur_d',{a:dg(d)}));return p.join(tr('dur_and'));}

const remCount=d=>Math.max(0,d.total-(d.prePaid||0)-d.payments.length);
const paidIn=(d,p)=>d.payments.some(x=>x.period===p);
function nextUnpaid(d){let q=d.start,g=0;while(paidIn(d,q)&&g++<600)q=perAdd(q,1);return q;}
function unpaidDueCount(d,p){let c=0,q=d.start,g=0;while(q<=p&&g++<600){if(!paidIn(d,q))c++;q=perAdd(q,1);}return Math.min(c,remCount(d));}
function debtAlerts(){const cp=curPer(),td=todayJ(),out=[];
  DEB().forEach(d=>{if(remCount(d)<=0)return;const np=nextUnpaid(d),T=esc(d.title);
    if(np<cp){const n=Math.max(1,unpaidDueCount(d,perAdd(cp,-1)));out.push({lvl:'bad',d,days:-999,txt:tr('a_late',{t:T,n:n>1?tr('a_monthsN',{a:dg(n)}):'',a:money(d.monthly*n)})});}
    else if(np===cp){const days=Math.min(d.dueDay,mLen(td[0],td[1]))-td[2];
      if(days<0)out.push({lvl:'bad',d,days,txt:tr('a_past',{t:T,d:dg(-days),a:money(d.monthly)})});
      else if(days===0)out.push({lvl:'bad',d,days,txt:tr('a_today',{t:T,a:money(d.monthly)})});
      else if(days<=S.settings.alertDays)out.push({lvl:'warn',d,days,txt:tr('a_soon',{t:T,d:dg(days),a:money(d.monthly)})});}});
  return out.sort((a,b)=>a.days-b.days);}
function snowball(extra){
  const ds=DEB().filter(d=>remCount(d)>0).map(d=>({id:d.id,title:d.title,min:d.monthly,bal:d.monthly*remCount(d)})).sort((a,b)=>a.bal-b.bal);
  const order=ds.map(d=>({id:d.id,title:d.title}));if(!ds.length)return{months:0,finish:{},order};
  const budget=ds.reduce((s,d)=>s+d.min,0)+Math.max(0,extra||0);let m=0;const finish={};
  while(ds.some(d=>d.bal>0.5)&&m<600){m++;let pool=budget;
    for(const d of ds)if(d.bal>0.5){const p=Math.min(d.min,d.bal);d.bal-=p;pool-=p;}
    for(const d of ds)if(d.bal>0.5&&pool>0){const p=Math.min(pool,d.bal);d.bal-=p;pool-=p;}
    for(const d of ds)if(d.bal<=0.5&&!finish[d.id])finish[d.id]=m;}
  return{months:m,finish,order};}

/* Priority-first monthly engine */
function calc(p){
  p=p||curPer();const st=S.settings,td=todayJ(),isCur=p===curPer();const[y,m]=p.split('/').map(Number);const ml=mLen(y,m);
  const I=sum(INC().filter(x=>x.date.startsWith(p)),'amount');
  let paid=0,unpaid=0;DEB().forEach(d=>{d.payments.forEach(x=>{if(x.on.startsWith(p))paid+=x.amount;});if(isCur)unpaid+=unpaidDueCount(d,p)*d.monthly;});
  const L=paid+unpaid,N=Math.max(0,I-L),shortfall=Math.max(0,L-I);
  let needs,wants,save;
  if(st.model==='zero'){save=Math.min(N,st.zbSave||0);needs=Math.min(N-save,st.zbNeeds||0);wants=N-save-needs;}
  else{needs=N*st.needs/100;wants=N*st.wants/100;save=N*st.save/100;}
  const ex=EXP().filter(x=>x.date.startsWith(p));const E=sum(ex,'amount'),Ess=sum(ex.filter(x=>x.ess),'amount'),NonEss=E-Ess;
  const spendable=needs+wants,R=spendable-E;
  const remDays=isCur?ml-td[2]+1:0;const todayEx=isCur?ex.filter(x=>x.date===jS(td)):[];const todaySpent=sum(todayEx,'amount');
  const plOf=planResolver();
  const plans=PLN().map(pl=>{const sp=sum(ex.filter(x=>plOf(x)===pl.id),'amount');return{pl,spent:sp,rem:Math.max(0,pl.amount-sp)};});
  const planIds=new Set(plans.map(x=>x.pl.id)),planned=plans.reduce((s,x)=>s+x.pl.amount,0),planSpent=plans.reduce((s,x)=>s+x.spent,0),reserveAll=plans.reduce((s,x)=>s+x.rem,0),reserve=isCur?reserveAll:0;
  const todayFree=sum(todayEx.filter(x=>!plOf(x)),'amount');
  const safeDaily=remDays>0?Math.max(0,R-reserve+todayFree)/remDays:0;
  const contrib=GOA().reduce((a,g)=>a+sum(g.contributions.filter(c=>c.date.startsWith(p)),'amount'),0);
  const dayNow=isCur?td[2]:ml,burn=dayNow>0?E/dayNow:0,runOut=burn>0&&spendable>0?Math.ceil(spendable/burn):null;
  return{p,y,m,ml,I,paid,unpaid,L,N,shortfall,needs,wants,save,E,Ess,NonEss,spendable,R,remDays,todaySpent,todayFree,plans,planned,planSpent,reserve,reserveAll,need:L+planned,safeDaily,contrib,dayNow,burn,runOut,isCur,ex};}
function planResolver(){const pls=PLN(),ids=new Set(pls.map(p=>p.id)),auto={};pls.forEach(pl=>{if(pl.autoCat&&!auto[pl.cat])auto[pl.cat]=pl.id;});return x=>x.plan&&ids.has(x.plan)?x.plan:(auto[x.cat]||'');}
function cashBalance(){let c=S.settings.opening||0;c+=sum(INC(),'amount')-sum(EXP(),'amount');DEB().forEach(d=>c-=sum(d.payments,'amount'));GOA().forEach(g=>c-=sum(g.contributions,'amount'));return c;}

/* Goals math (with inflation / FX growth buffer) */
const goalSaved=g=>(+g.initial||0)+sum(g.contributions,'amount');
function goalFull(g){if(g.tpl==='immig')return sum(g.stages||[],'amt')*(+g.rate||0);if(g.tpl==='lang')return(+g.fee||0)+(+g.classes||0);return +g.target||0;}
function goalPaid(g){if(g.tpl==='immig')return sum((g.stages||[]).filter(s=>s.done),'amt')*(+g.rate||0);if(g.tpl==='lang')return(g.feePaid?+g.fee||0:0)+(g.classesPaid?+g.classes||0:0);return 0;}
function goalNeedNow(g){return Math.max(0,goalFull(g)-goalPaid(g));}
const growth=g=>(g.tpl==='car'||g.tpl==='immig')?(+g.infl||0)/100:0;
const needAt=(g,mo)=>goalNeedNow(g)*Math.pow(1+growth(g),mo/12);
function etaMonths(g,extra){const s=goalSaved(g),m=(+g.monthly||0)+(extra||0),n0=goalNeedNow(g);if(goalFull(g)<=0)return null;if(s>=n0)return 0;if(m<=0)return Infinity;
  if(!growth(g))return(n0-s)/m;for(let x=0;x<=600;x+=0.05)if(s+m*x>=needAt(g,x))return x;return Infinity;}
function goalDeadline(g){return g.tpl==='lang'?g.examDate:g.deadline;}

function potentialSavings(){const td=todayJ(),groups={};
  EXP().forEach(x=>{if(x.ess)return;const pj=parseJ(x.date);if(!pj)return;const dd=dayDiff(pj,td);if(dd<0||dd>29)return;
    const r=RULES.find(r=>r.re.test(x.desc||''));const ck=isCat(x.cat)?x.cat:'misc';const ca=CAT_ALT[ck]||CAT_ALT.misc;
    const def=r?{k:r.k,i:r.i,title:r[UI.lang][0],alt:r[UI.lang][1],rate:r.rate}:{k:'c_'+ck,i:cat(ck).i,title:cn(ck),alt:ca[UI.lang],rate:ca.r};
    const g=groups[def.k]||(groups[def.k]=Object.assign(def,{total:0,count:0}));g.total+=x.amount;g.count++;});
  const list=Object.values(groups).map(g=>Object.assign(g,{save:Math.round(g.total*g.rate/1000)*1000})).filter(g=>g.save>0).sort((a,b)=>b.save-a.save);
  return{list,total:sum(list,'save')};}
function impacts(saving){const out=[];const b=snowball(0);
  if(b.order.length){const w=snowball(saving),f=b.order[0],dm=b.finish[f.id]-w.finish[f.id];if(dm>0)out.push(tr('imp_debt',{t:esc(f.title),a:fmtDur(dm*MONTH_D)}));}

function niceMax(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m))),n=m/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p;}
function donutSVG(outer,inner,c1,c2,label){const cx=100,cy=100;
  const ring=(rows,R,w)=>{const tot=sum(rows,'v');if(!tot)return`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="${w}"/>`;const C=2*Math.PI*R;let off=0;
    return rows.filter(x=>x.v>0).map(x=>{const len=x.v/tot*C;const s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${x.c}" stroke-width="${w}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(x.l)}: ${money(x.v)}</title></circle>`;off+=len;return s;}).join('');};
  return `<svg viewBox="0 0 200 200" class="chart donut" role="img" aria-label="${esc(label)}">${ring(outer,82,22)}${ring(inner,60,12)}<text x="100" y="98" text-anchor="middle" class="c1">${c1}</text><text x="100" y="118" text-anchor="middle" class="c2">${c2}</text></svg>`;}
function barsSVG(groups,series,label){const W=600,H=260,pl=58,pr=10,pt=12,pb=34,ih=H-pt-pb;const mx=niceMax(Math.max(0,...groups.flatMap(g=>g.v)));const gw=(W-pl-pr)/groups.length;const bw=Math.min(24,(gw-14)/series.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(label)}" direction="ltr">`;
  for(let i=0;i<=4;i++){const y=pt+ih*(1-i/4);s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${compact(mx*i/4)}</text>`;}
  groups.forEach((g,gi)=>{const x0=pl+gi*gw+(gw-bw*series.length)/2;g.v.forEach((v,si)=>{const h=v/mx*ih;s+=`<rect x="${(x0+si*bw).toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="${series[si].c}"><title>${esc(series[si].l)} · ${esc(g.l)}: ${money(v)}</title></rect>`;});s+=`<text x="${pl+gi*gw+gw/2}" y="${H-12}" text-anchor="middle">${esc(g.l)}</text>`;});
  return s+'</svg>';}
function lineSVG(c,label){const W=600,H=250,pl=58,pr=14,pt=12,pb=30,iw=W-pl-pr,ih=H-pt-pb,ml=c.ml;
  const daily=Array(ml+1).fill(0);c.ex.forEach(x=>{const d=+x.date.slice(8,10);if(d>=1&&d<=ml)daily[d]+=x.amount;});
  const cum=[];let run=0;for(let d=1;d<=c.dayNow;d++){run+=daily[d];cum.push(run);}
  const proj=c.isCur&&c.dayNow<ml&&c.burn>0?c.burn*ml:0;const mx=niceMax(Math.max(c.spendable,run,proj,1)*1.05);
  const X=d=>pl+(d-1)/(ml-1)*iw,Y=v=>pt+ih*(1-v/mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(label)}" direction="ltr">`;
  for(let i=0;i<=4;i++){const y=pt+ih*(1-i/4);s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${compact(mx*i/4)}</text>`;}
  for(let d=1;d<=ml;d+=(d===1?4:5))s+=`<text x="${X(d)}" y="${H-10}" text-anchor="middle">${dg(d)}</text>`;
  if(c.spendable>0)s+=`<line x1="${X(1)}" y1="${Y(c.spendable/ml)}" x2="${X(ml)}" y2="${Y(c.spendable)}" stroke="var(--sec)" stroke-width="2.5" stroke-dasharray="7 5"><title>${tr('ch_pace')}</title></line>`;
  if(proj&&cum.length)s+=`<line x1="${X(c.dayNow)}" y1="${Y(run)}" x2="${X(ml)}" y2="${Y(proj)}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="2 5"/>`;
  if(cum.length){s+=`<polyline fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round" points="${cum.map((v,i)=>X(i+1).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;s+=`<circle cx="${X(c.dayNow)}" cy="${Y(run)}" r="4.5" fill="var(--pri)"><title>${money(run)}</title></circle>`;}
  return s+'</svg>';}
function donutFor(c){const rows=catKeys().map(k=>({l:cn(k),c:cat(k).c,v:sum(c.ex.filter(x=>x.cat===k),'amount')})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);

  else nav=`<div class="row2">${rfDateBox('from',tr('rf_from'))}${rfDateBox('to',tr('rf_to'))}</div>`;

  <div class="row2">${RF.types.includes('exp')?`<label class="fld"><span>${tr('rf_cat')}</span><select data-rf="cat"><option value="">${tr('rf_all')}</option>${catKeys().map(k=>`<option value="${k}" ${RF.cat===k?'selected':''}>${cat(k).i} ${cn(k)}</option>`).join('')}</select></label><label class="fld"><span>${tr('kind')}</span><select data-rf="ess"><option value="">${tr('rf_all')}</option><option value="1" ${RF.ess==='1'?'selected':''}>${tr('ess')}</option><option value="0" ${RF.ess==='0'?'selected':''}>${tr('noness')}</option></select></label>`:''}
  ${RF.types.includes('inst')?`<label class="fld"><span>${tr('rf_debt')}</span><select data-rf="debt"><option value="">${tr('rf_all')}</option>${DEB().map(d=>`<option value="${d.id}" ${RF.debt===d.id?'selected':''}>${esc(d.title)}</option>`).join('')}</select></label>`:''}</div>
  <label class="fld"><span>${tr('rf_q')}</span><input data-rf="q" value="${esc(RF.q)}" placeholder="${tr('rf_qPh')}"></label>`;}
function rfRow(t){const neg=t.k!=='inc';return `<tr><td class="num">${dg(t.d)}</td><td>${t.lbl}${t.k==='exp'?` <span class="tag ${t.ess?'e':'n'}">${tr(t.ess?'ess':'noness')}</span>`:''}</td><td>${esc(t.s)}</td><td class="num ${neg?'neg':'pos'}" dir="ltr" style="text-align:end">${neg?'−':'+'}${num(t.a)}</td></tr>`;}
function rfFoot(T,cols){const r=(l,v,sg,b)=>`<tr class="${b?'net':''}"><td colspan="${cols-1}">${l}</td><td class="num" dir="ltr" style="text-align:end">${sg}${num(Math.abs(v))}</td></tr>`;let f='';
  if(RF.types.includes('inc'))f+=r(tr('rt_inc'),T.inc,'+');if(RF.types.includes('exp'))f+=r(tr('rt_exp'),T.exp,'−');if(RF.types.includes('inst'))f+=r(tr('rt_inst'),T.inst,'−');if(RF.types.includes('dep'))f+=r(tr('rt_dep'),T.dep,'−');
  return f+r(tr('rf_net'),T.net,T.net<0?'−':'+',true);}
function rfByDebt(tx){const by={};tx.filter(t=>t.k==='inst').forEach(t=>{const b=by[t.debt]||(by[t.debt]={s:t.s.split(' · ')[0],n:0,a:0});b.n++;b.a+=t.a;});return Object.values(by).sort((a,b)=>b.a-a.a);}
function reportResultsHTML(){const {label}=rfRange(),tx=filteredTx(),T=rfTotals(tx);
  let h=`<section class="card"><h3>📊 ${tr('rf_sum',{a:label})}</h3><div class="ledger">${RF.types.includes('inc')?led(tr('rt_inc'),money(T.inc)):''}${RF.types.includes('exp')?led(tr('rt_exp'),money(T.exp),tr('rf_essSplit',{a:num(T.ess),b:num(T.non)})):''}${RF.types.includes('inst')?led(tr('rt_inst'),money(T.inst)):''}${RF.types.includes('dep')?led(tr('rt_dep'),money(T.dep)):''}${led(tr('rf_net'),money(T.net),tr('rf_netHint'),T.net<0?'bad':'')}</div></section>`;
  const ex=tx.filter(t=>t.k==='exp');if(ex.length)h+=`<section class="card"><h3>${tr('ch_donut')}</h3>${catBarsHTML({ex:ex.map(t=>({cat:t.cat,ess:t.ess,amount:t.a})),E:T.exp,Ess:T.ess,NonEss:T.non})}</section>`;
  const bd=rfByDebt(tx);if(bd.length)h+=`<section class="card"><h3>💳 ${tr('rf_byDebt')}</h3><ol class="alloc">${bd.map(x=>`<li><b>${esc(x.s)} <span class="muted sm">(${dg(x.n)} ${tr('rf_payments')})</span></b><span>${money(x.a)}</span></li>`).join('')}<li><b>${tr('total')}</b><span><b>${money(T.inst)}</b></span></li></ol></section>`;
  h+=`<section class="card"><h3>🧾 ${tr('rf_list',{a:dg(T.n)})}</h3>${tx.length?`<div class="tbl"><table class="rft"><thead><tr><th>${tr('date')}</th><th>${tr('p_type')}</th><th>${tr('desc')}</th><th style="text-align:end">${tr('amount')}</th></tr></thead><tbody>${tx.map(rfRow).join('')}</tbody><tfoot>${rfFoot(T,4)}</tfoot></table></div>`:empty(tr('noData'))}</section>`;
  return h;}
function printRF(){const {label}=rfRange(),tx=filteredTx(),T=rfTotals(tx),td=todayJ(),bd=rfByDebt(tx),ex=tx.filter(t=>t.k==='exp');
  const flt=[RF.types.map(k=>tr('rt_'+k)).join('، '),RF.cat?cn(RF.cat):'',RF.ess?tr(RF.ess==='1'?'ess':'noness'):'',RF.debt?esc((findD(RF.debt)||{}).title||''):'',RF.q?'«'+esc(RF.q)+'»':''].filter(Boolean).join(' · ');

   <h2>${tr('p_kpi')}</h2><div class="kpis">${RF.types.includes('inc')?kp(tr('rt_inc'),money(T.inc)):''}${RF.types.includes('exp')?kp(tr('rt_exp'),money(T.exp)):''}${RF.types.includes('inst')?kp(tr('rt_inst'),money(T.inst)):''}${RF.types.includes('dep')?kp(tr('rt_dep'),money(T.dep)):''}${kp(tr('rf_net'),money(T.net))}</div>
   ${ex.length?`<h2>${tr('ch_donut')}</h2>${catBarsHTML({ex:ex.map(t=>({cat:t.cat,ess:t.ess,amount:t.a})),E:T.exp,Ess:T.ess,NonEss:T.non})}`:''}
   ${bd.length?`<h2>${tr('rf_byDebt')}</h2><table><tbody>${bd.map(x=>`<tr><td>${esc(x.s)} (${dg(x.n)} ${tr('rf_payments')})</td><td class="num">${num(x.a)}</td></tr>`).join('')}<tr><td><b>${tr('total')}</b></td><td class="num"><b>${num(T.inst)}</b></td></tr></tbody></table>`:''}
   <h2>${tr('rf_list',{a:dg(T.n)})}</h2><table><thead><tr><th>${tr('date')}</th><th>${tr('p_type')}</th><th>${tr('desc')}</th><th>${tr('amount')}</th></tr></thead><tbody>${tx.slice().reverse().map(t=>`<tr><td>${dg(t.d)}</td><td>${t.lbl}${t.k==='exp'?' ('+tr(t.ess?'ess':'noness')+')':''}</td><td>${esc(t.s)}</td><td class="num" dir="ltr">${t.k==='inc'?'+':'−'}${num(t.a)}</td></tr>`).join('')}</tbody><tfoot>${rfFoot(T,4)}</tfoot></table>
   <div class="foot">${tr('p_foot')}</div>`;

function rfCSV(){const rows=[['date','type','category','essential','description','amount']];filteredTx().slice().reverse().forEach(t=>rows.push([t.d,tr('rt_'+t.k),t.k==='exp'?cn(t.cat):'',t.k==='exp'?(t.ess?'1':'0'):'',t.s,(t.k==='inc'?1:-1)*t.a]));const T=rfTotals(filteredTx());rows.push([]);RT.filter(k=>RF.types.includes(k)).forEach(k=>rows.push(['',tr('rt_'+k),'','','',(k==='inc'?1:-1)*T[k]]));rows.push(['',tr('rf_net'),'','','',T.net]);return '\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}

function evalRows(c){const rows=[],add=(l,act,tgt,lvl)=>rows.push({l,act,tgt,lvl});
  if(c.I>0){const r=c.L/c.I;add(tr('ev_dti'),pct(r),tr('ev_max',{a:pct(.35)}),r<=.35?'ok':r<=.5?'warn':'bad');}
  if(c.need>0){const r=c.I/c.need;add(tr('ev_cover'),pct(r),tr('ev_min',{a:pct(1.1)}),r>=1.1?'ok':r>=1?'warn':'bad');}
  if(c.needs>0||c.Ess>0)add(tr('ev_needs'),money(c.Ess),money(c.needs),c.Ess<=c.needs?'ok':c.Ess<=c.needs*1.1?'warn':'bad');
  if(c.wants>0||c.NonEss>0)add(tr('ev_wants'),money(c.NonEss),money(c.wants),c.NonEss<=c.wants?'ok':c.NonEss<=c.wants*1.1?'warn':'bad');
  if(c.planned>0)add(tr('ev_plans'),money(c.planSpent),money(c.planned),c.planSpent<=c.planned?'ok':c.planSpent<=c.planned*1.1?'warn':'bad');
  if(c.I>0&&c.save>0)add(tr('ev_save'),pct(c.contrib/c.I),pct(c.save/c.I),c.contrib>=c.save*.95?'ok':c.contrib>0?'warn':'bad');
  add(tr('ev_left'),money(c.R),tr('ev_min',{a:dg(0)}),c.R>=0?'ok':'bad');
  return rows;}
function evalHTML(rows){if(!rows.length)return empty(tr('noData'));const ok=rows.filter(r=>r.lvl==='ok').length;
  return `<p><b>${tr('ev_score',{a:dg(ok),b:dg(rows.length)})}</b></p><div class="tbl"><table class="ev"><thead><tr><th>${tr('ev_metric')}</th><th>${tr('ev_actual')}</th><th>${tr('ev_target')}</th><th>${tr('p_status')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.l}</td><td class="num">${r.act}</td><td class="num muted">${r.tgt}</td><td style="white-space:nowrap"><span class="dot ${r.lvl}"></span> ${tr('ev_'+r.lvl)}</td></tr>`).join('')}</tbody></table></div>`;}
function catBarsHTML(c){const rows=catKeys().map(k=>{const a=c.ex.filter(x=>x.cat===k);return{k,v:sum(a,'amount'),ne:sum(a.filter(x=>!x.ess),'amount')};}).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);if(!rows.length)return empty(tr('noData'));const mx=rows[0].v;
  return `<div class="tbl"><table class="cb"><tbody>${rows.map(r=>`<tr><td style="width:34%">${cat(r.k).i} ${cn(r.k)}</td><td><div class="hb"><span style="width:${((r.v-r.ne)/mx*100).toFixed(1)}%;background:#0F766E"></span><span style="width:${(r.ne/mx*100).toFixed(1)}%;background:#F59E0B"></span></div></td><td class="num" style="width:30%;text-align:end">${num(r.v)} (${pct(r.v/c.E)})</td></tr>`).join('')}</tbody></table></div><div class="legend"><span><i style="background:#0F766E"></i>${tr('ess')} ${pct(c.E?c.Ess/c.E:0)}</span><span><i style="background:#F59E0B"></i>${tr('noness')} ${pct(c.E?c.NonEss/c.E:0)}</span></div>`;}

async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',enc8(pass),'PBKDF2',false,['deriveBits']);return b64e(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc8(salt),iterations:150000,hash:'SHA-256'},base,256));}
const aesKey=()=>crypto.subtle.importKey('raw',b64d(SC.keyB64),'AES-GCM',false,['encrypt','decrypt']);
async function seal(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(),enc8(JSON.stringify(obj)));return{v:2,iv:b64e(iv),ct:b64e(ct),at:Date.now(),dev:META.deviceId};}
async function open_(env){if(!env||!env.ct)return null;try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},await aesKey(),b64d(env.ct));return JSON.parse(new TextDecoder().decode(pt));}catch(e){throw new Error(tr('sy_wrongKey'));}}

/* Merge: newest `u` wins per record; deletions are tombstones */
const COLLS=['incomes','expenses','debts','goals','plans','cats','quick'];
function mergeColl(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(r=>{if(!r||!r.id)return;const x=m.get(r.id);if(!x||(r.u||0)>(x.u||0))m.set(r.id,r);});const cut=Date.now()-180*864e5;return [...m.values()].filter(r=>!(r.del&&r.u<cut)).sort((x,y)=>x.id<y.id?-1:1);}
function mergeState(l,r){const o={v:2,settings:((r.settings||{}).u||0)>((l.settings||{}).u||0)?r.settings:l.settings};COLLS.forEach(k=>o[k]=mergeColl(l[k],r[k]));return o;}
const canon=s=>JSON.stringify({settings:s.settings,incomes:mergeColl(s.incomes,[]),expenses:mergeColl(s.expenses,[]),debts:mergeColl(s.debts,[]),goals:mergeColl(s.goals,[]),plans:mergeColl(s.plans||[],[]),cats:mergeColl(s.cats||[],[]),quick:mergeColl(s.quick||[],[])});
let syncing=false,syncStart=0,again=false,syncTimer=null,retryTimer=null,retryN=0;const RETRY=[5,15,30,60];
function scheduleRetry(){clearTimeout(retryTimer);const s=RETRY[Math.min(retryN,RETRY.length-1)];retryN++;retryTimer=setTimeout(()=>syncNow(),s*1000);}
function scheduleSync(){if(!SC.enabled)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500);}
async function syncNow(){if(!SC.enabled){setSync('local');return;}if(syncing&&Date.now()-syncStart>40000)syncing=false;if(syncing){again=true;return;}if(!navigator.onLine){setSync('offline');scheduleRetry();return;}clearTimeout(retryTimer);syncStart=Date.now();
  syncing=true;setSync('syncing');
  try{const remote=await open_(await remoteGet());const merged=remote?mergeState(S,normalize(remote,true)):S;const mc=canon(merged);
    if(mc!==canon(S)){S=merged;saveJSON(KEY,S);safeRender();}
    if(!remote||mc!==canon(remote))await remotePut(await seal(JSON.parse(mc)));
    META.lastSync=Date.now();saveJSON('dk2_meta',META);retryN=0;setSync('synced');if(tab==='settings')safeRender();}
  catch(e){const m=e.message||String(e);setSync(!navigator.onLine||m===tr('sy_timeout')||m===tr('sy_net')?'offline':'error',m);scheduleRetry();}
  finally{syncing=false;if(again){again=false;syncNow();}}}
async function connectSync(f){const E=f.elements,v=n=>(E[n]&&E[n].value||'').trim();
  if(!(window.crypto&&crypto.subtle))return toast(tr('sy_needHttps'),'bad');
  const cfg={enabled:true,provider:v('provider'),mode:v('provider')==='firebase'?v('mode'):'key',ghToken:v('ghToken'),dbUrl:v('dbUrl'),apiKey:v('apiKey'),email:v('email').toLowerCase(),restUrl:v('restUrl'),restToken:v('restToken')};
  if((cfg.provider==='firebase'&&!/^https:\/\//.test(cfg.dbUrl))||(cfg.provider==='rest'&&!/^https?:\/\//.test(cfg.restUrl))||(cfg.provider==='gist'&&cfg.ghToken.length<20))return toast(tr('sy_fill'),'bad');

    toast(tr('sy_connected'));render();}

function toCSV(){const rows=[['type','date','amount','category','essential','description','ref']];
  INC().forEach(x=>rows.push(['income-'+x.type,x.date,x.amount,'','',x.desc,'']));
  EXP().forEach(x=>rows.push(['expense',x.date,x.amount,x.cat,x.ess?'1':'0',x.desc,'']));

  GOA().forEach(g=>{rows.push(['goal',jS(todayJ()),Math.round(goalNeedNow(g)),g.tpl,'',g.title,'saved:'+goalSaved(g)]);g.contributions.forEach(c=>rows.push(['goal-contribution',c.date,c.amount,'','',g.title,'']));});
  return '\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
function parseCSV(t){const rows=[];let row=[],cell='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}else if(c!=='\r')cell+=c;}if(cell||row.length){row.push(cell);rows.push(row);}return rows;}

  if(el.dataset&&el.dataset.rf&&el.dataset.rf!=='q'){const k=el.dataset.rf;if(k==='mode')RF.mode=el.value;else if(k==='type')RF.types=[...document.querySelectorAll('[data-rf=type]:checked')].map(x=>x.value);else if(k==='from'||k==='to'){const j=parseJ(el.value);RF[k]=j?jS(j):'';}else RF[k]=el.value;render();return;}
  if(el.name==='plan'&&el.form&&el.value){const pl=PLN().find(x=>x.id===el.value);if(pl){const c1=el.form.querySelector(`[name=cat][value="${pl.cat}"]`),e1=el.form.querySelector(`[name=ess][value="${pl.ess?'1':'0'}"]`);if(c1)c1.checked=true;if(e1)e1.checked=true;if(!el.form.elements.desc.value)el.form.elements.desc.value=pl.title;}}
  if(el.name==='cat'&&el.form&&!((el.form.elements.eid||el.form.elements.pid||{}).value)){const r=el.form.querySelector(`[name=ess][value="${cat(el.value).ess?'1':'0'}"]`);if(r)r.checked=true;}
  if(el.id==='impJson'){importJSON(el.files[0]);el.value='';}if(el.id==='impCsv'){importCSV(el.files[0]);el.value='';}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
$('#dp').addEventListener('click',e=>{if(e.target.id==='dp')$('#dp').classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dp').classList.contains('open'))$('#dp').classList.remove('open');else closeModal();}});
let lastDay=jS(todayJ());
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const d=jS(todayJ());if(d!==lastDay){lastDay=d;viewPer=curPer();safeRender();}notifyDue();syncNow();});
window.addEventListener('online',()=>{retryN=0;syncNow();});window.addEventListener('focus',()=>syncNow());window.addEventListener('pageshow',()=>syncNow());
if(navigator.connection&&navigator.connection.addEventListener)navigator.connection.addEventListener('change',()=>{retryN=0;setTimeout(syncNow,1500);});window.addEventListener('offline',()=>{if(SC.enabled)setSync('offline');});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(tab==='settings')safeRender();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyChrome());

function makeIcon(s){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),u=s/100,g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,'#0D9488');g.addColorStop(1,'#6366F1');x.fillStyle=g;x.fillRect(0,0,s,s);x.strokeStyle='#fff';x.lineWidth=7*u;x.beginPath();x.arc(50*u,50*u,26*u,0,Math.PI*2);x.stroke();x.fillStyle='#FBBF24';x.beginPath();x.arc(50*u,50*u,12*u,0,Math.PI*2);x.fill();return c.toDataURL('image/png');}
const ICON192=makeIcon(192),ICON512=makeIcon(512);
function setupManifest(){if(/^https?:$/.test(location.protocol))return;const base=location.href.split('#')[0].split('?')[0];const m={name:tr('app'),short_name:tr('app'),lang:UI.lang,dir:FA_LANG()?'rtl':'ltr',start_url:base,scope:base.replace(/[^/]*$/,''),display:'standalone',background_color:'#F8FAFC',theme_color:'#0D9488',icons:[{src:ICON192,sizes:'192x192',type:'image/png'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  $('#manifestLink').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));$('#favLink').href=ICON192;$('#appleLink').href=ICON192;}
setupManifest();
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
notifyDue();setInterval(notifyDue,30*60*1000);
syncNow();setInterval(()=>{if(!document.hidden)syncNow();},60000);
</script>
